<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(fonts/geist-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:F;src:url(fonts/fraunces-latin-standard-normal.woff2);font-weight:100 900}
@font-face{font-family:F;font-style:italic;src:url(fonts/fraunces-latin-wght-italic.woff2);font-weight:100 900}
:root{--paper:#F4F1E9;--ink:#211D16;--soft:#6B6255;--clay:#C1602E;--rule:rgba(33,29,22,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:G,sans-serif;overflow:hidden}
.frame{position:absolute;inset:36px;border:3px solid var(--rule)}
.safe{position:absolute;left:100px;right:100px;display:flex;flex-direction:column;justify-content:center}
.eb{font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);margin-bottom:34px}
h1{font-family:F,serif;font-weight:500;font-size:118px;line-height:1.06;letter-spacing:-.012em}
h1 em,h2 em{color:var(--clay);font-style:italic}
h2{font-family:F,serif;font-weight:500;font-size:96px;line-height:1.1}
.num{font-family:F,serif;font-style:italic;font-size:210px;line-height:1;color:var(--clay);font-weight:400}
.sub{font-size:48px;line-height:1.42;color:var(--soft);margin-top:34px}
.pill{display:inline-block;margin-top:52px;padding:26px 44px;border:3px solid var(--ink);font-size:38px;letter-spacing:.01em}
.brandbar{position:absolute;left:100px;right:100px;display:flex;align-items:center;justify-content:space-between;font-size:30px;color:var(--soft)}
.brand{display:flex;align-items:center;gap:14px;font-family:F,serif;font-style:italic;font-size:42px;color:var(--ink)}
.abs{position:absolute}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
[data-a]{opacity:0}
</style></head><body><div class="frame"></div><div class="safe" style="top:300px;bottom:420px;"><h1 data-a=".2" data-b="3.0" data-d=".9">No signal doesn't mean <em>no sighting.</em></h1></div><div class="abs" data-a="3.2" data-b="6.4" data-y="0" style="left:0;right:0;top:560px;display:flex;justify-content:center"><svg viewBox="0 0 64 48" width="140" height="105" fill="none" stroke="#211D16" stroke-width="3" stroke-linecap="round"><rect x="18" y="8" width="28" height="40" rx="6"/><path d="M26 6 L38 42 M38 6 L26 42" stroke="#C1602E" stroke-width="4"/></svg></div><div class="safe" style="top:980px;bottom:420px;"><h2 style="text-align:center;font-size:76px" data-a="3.6" data-b="6.4">It saves right where <em>you are.</em></h2></div><div class="abs" data-a="6.6" data-b="9.8" data-y="0" style="left:0;right:0;top:520px;display:flex;justify-content:center;align-items:center;gap:60px"><div style="position:relative;width:260px;height:130px"><div class="abs" style="left:0px;top:0px;width:180px;height:110px;background:#F4F1E9;border:3px solid #211D16;border-radius:14px"></div><div class="abs" style="left:40px;top:-10px;width:180px;height:110px;background:#F4F1E9;border:3px solid #211D16;border-radius:14px"></div><div class="abs" style="left:80px;top:-20px;width:180px;height:110px;background:#F4F1E9;border:3px solid #211D16;border-radius:14px"></div></div><div style="position:relative"><svg viewBox="0 0 120 90" width="300" height="225" fill="none" stroke="#211D16" stroke-width="3" stroke-linejoin="round"><path d="M30 72a20 20 0 0 1 3-40 28 28 0 0 1 55 6 18 18 0 0 1 2 34z"/></svg><div style="position:absolute;left:30px;top:15px"><svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="#C1602E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" class="draw" data-a="8.6" data-d=".6" d="M4 13 L10 19 L20 6"/></svg></div></div></div><div class="safe" style="top:980px;bottom:420px;"><h2 style="text-align:center;font-size:72px" data-a="7.2" data-b="9.8">And sends the moment <em>you're back.</em></h2></div><div class="safe" style="top:300px;bottom:420px;" data-a="10.0"><div class="eb">BioMap</div><h1>Nothing gets lost in a <em>dead zone.</em></h1><div class="sub">iOS app coming soon. Link in bio.</div><div><span class="pill">Link in bio</span></div></div><div class="brandbar" style="top:1450px" data-a="0.4" data-d="0.5" data-y="0"><div class="brand"><svg class="" viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="#1B1812" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27C11 14 21 7 34 7c2.7 0 5 .4 7 1.1-1.8 1-3.3 2.3-4.4 4C40 12.4 43 13.4 45 15.3c-3 .3-5.6 1.4-7.7 3.2 1 6.7-1.2 13-6.4 17.6C25.8 41.4 18.8 43.6 11 42.4c3.6-1 6.6-2.9 8.8-5.5-5-.4-9.4-3-12.2-7.1 2.6.7 5.1.6 7.4-.4C11 27.8 7.9 25 6 21.2" /><circle class="eye" cx="33.5" cy="14.5" r="1.4" fill="#1B1812" stroke="none"/></svg>BioMap</div><div>getbiomap.web.app</div></div><script>
const ease=t=>1-Math.pow(1-t,3);
const clamp=x=>Math.min(1,Math.max(0,x));
const seg=(t,a,d)=>clamp((t-a)/d);
window.seg=seg;window.ease=ease;
window.render=function(t){
  document.querySelectorAll('[data-a]').forEach(el=>{
    const a=+el.dataset.a,b=el.dataset.b?+el.dataset.b:Infinity;
    const inn=ease(seg(t,a,+(el.dataset.d||.6))),out=ease(seg(t,b,.4));
    const y=(1-inn)*(+(el.dataset.y||44))-out*24;
    el.style.opacity=inn*(1-out);
    el.style.transform=`translateY(${y}px)`;
  });
  document.querySelectorAll('.draw').forEach(p=>{
    const a=+p.dataset.a||0,d=+p.dataset.d||1.4;
    const prog=ease(seg(t,a,d));
    p.style.strokeDashoffset=1-prog;
    const eye=p.closest('svg').querySelector('.eye');
    if(eye)eye.style.opacity=clamp((prog-.85)/.15);
  });
  if(window.custom)window.custom(t);
};
</script></body></html>
