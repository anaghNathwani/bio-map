-y="0" style="left:785px;top:525px"><div style="transform:scaleX(-1)"><svg class="" viewBox="0 0 48 48" width="150" height="150" fill="none" stroke="#1B1812" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27C11 14 21 7 34 7c2.7 0 5 .4 7 1.1-1.8 1-3.3 2.3-4.4 4C40 12.4 43 13.4 45 15.3c-3 .3-5.6 1.4-7.7 3.2 1 6.7-1.2 13-6.4 17.6C25.8 41.4 18.8 43.6 11 42.4c3.6-1 6.6-2.9 8.8-5.5-5-.4-9.4-3-12.2-7.1 2.6.7 5.1.6 7.4-.4C11 27.8 7.9 25 6 21.2" pathLength="1" class="draw" data-a="10.50" data-d=".9"/><circle class="eye" cx="33.5" cy="14.5" r="1.4" fill="#1B1812" stroke="none"/></svg></div></div><div class="safe" style="top:850px;bottom:300px;"><h1 data-a="10.65" data-b="12.50" data-d=".8">BirdMap <em>doesn't guess.</em></h1></div><div class="abs" data-a="12.70" data-b="14.70" data-y="0" style="left:265px;top:565px"><div style="transform:none"><svg class="" viewBox="0 0 48 48" width="150" height="150" fill="none" stroke="#1B1812" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27C11 14 21 7 34 7c2.7 0 5 .4 7 1.1-1.8 1-3.3 2.3-4.4 4C40 12.4 43 13.4 45 15.3c-3 .3-5.6 1.4-7.7 3.2 1 6.7-1.2 13-6.4 17.6C25.8 41.4 18.8 43.6 11 42.4c3.6-1 6.6-2.9 8.8-5.5-5-.4-9.4-3-12.2-7.1 2.6.7 5.1.6 7.4-.4C11 27.8 7.9 25 6 21.2" pathLength="1" class="draw" data-a="12.70" data-d=".9"/><circle class="eye" cx="33.5" cy="14.5" r="1.4" fill="#1B1812" stroke="none"/></svg></div></div><div class="safe" style="top:850px;bottom:300px;"><h1 data-a="12.85" data-b="14.70" data-d=".8">One pin per place. <em>Works with no signal.</em></h1></div><div class="safe" style="top:1040px;bottom:300px;"><h1 data-a="18.60" style="text-align:center">Bird<em>Map</em></h1></div><div class="safe" style="top:1260px;bottom:140px;" data-a="19.2"><div class="sub" style="text-align:center">iOS app coming soon. Link in bio.</div><div style="display:flex;justify-content:center"><span class="pill">Link in bio</span></div></div><div class="brandbar" style="top:1780px" data-a="19.6" data-d="0.5" data-y="0"><div class="brand"><svg class="" viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="#1B1812" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27C11 14 21 7 34 7c2.7 0 5 .4 7 1.1-1.8 1-3.3 2.3-4.4 4C40 12.4 43 13.4 45 15.3c-3 .3-5.6 1.4-7.7 3.2 1 6.7-1.2 13-6.4 17.6C25.8 41.4 18.8 43.6 11 42.4c3.6-1 6.6-2.9 8.8-5.5-5-.4-9.4-3-12.2-7.1 2.6.7 5.1.6 7.4-.4C11 27.8 7.9 25 6 21.2" /><circle class="eye" cx="33.5" cy="14.5" r="1.4" fill="#1B1812" stroke="none"/></svg>BirdMap</div><div>birdmap-citizenscience.web.app</div></div><canvas id="logo-cv" class="abs" style="inset:0" width="1080" height="1920"></canvas></div><script>
const ease=t=>1-Math.pow(1-t,3);
const clamp=x=>Math.min(1,Math.max(0,x));
const seg=(t,a,d)=>clamp((t-a)/d);
window.seg=seg;window.ease=ease;
window.render=function(t){
  document.querySelectorAll('[data-a]').forEach(el=>{
    const a=+el.dataset.a,b=el.dataset.b?+el.dataset.b:Infinity;
    const inn=ease(seg(t,a,+(el.dataset.d||.6))),out=ease(seg(t,b,.4));
    const y=(1-inn)*(+(el.dataset.y||44))-out*24;
    el.style.opacity=inn*(1-out);
    el.style.transform=`translateY(${y}px)`;
  });
  document.querySelectorAll('.draw').forEach(p=>{
    const a=+p.dataset.a||0,d=+p.dataset.d||1.4;
    const prog=ease(seg(t,a,d));
    p.style.strokeDashoffset=1-prog;
    const eye=p.closest('svg').querySelector('.eye');
    if(eye)eye.style.opacity=clamp((prog-.85)/.15);
  });
  if(window.custom)window.custom(t);
};

function pulse(t,at,d){return 1+0.07*clamp(1-Math.abs(t-(at+d/2))/(d/2),0,1)}
const _cv=document.getElementById('logo-cv'), _ctx=_cv.getContext('2d');
const _p=document.createElementNS('http://www.w3.org/2000/svg','path'); _p.setAttribute('d','M6 27C11 14 21 7 34 7c2.7 0 5 .4 7 1.1-1.8 1-3.3 2.3-4.4 4C40 12.4 43 13.4 45 15.3c-3 .3-5.6 1.4-7.7 3.2 1 6.7-1.2 13-6.4 17.6C25.8 41.4 18.8 43.6 11 42.4c3.6-1 6.6-2.9 8.8-5.5-5-.4-9.4-3-12.2-7.1 2.6.7 5.1.6 7.4-.4C11 27.8 7.9 25 6 21.2');
const _len=_p.getTotalLength(), _n=240, _targets=[], _seeds=[[260,560],[760,620],[460,520],[860,600],[340,640]];
for(let i=0;i<_n;i++){const pt=_p.getPointAtLength((i/_n)*_len); _targets.push({x:540+(pt.x-24)/48*420,y:760+(pt.y-24)/48*420})}
const _starts=_targets.map((_,i)=>{const s=_seeds[i%_seeds.length];return {x:s[0]+(Math.random()-.5)*260,y:s[1]+(Math.random()-.5)*260}});
const FORM_A=15.20, FORM_D=2.6;
window.custom=function(t){
  const p0={x:900,y:1500}, p1={x:540,y:747};
  const cp=ease(seg(t,0.2,2.0));
  const cx=p0.x+(p1.x-p0.x)*cp, cy=p0.y+(p1.y-p0.y)*cp-Math.sin(cp*Math.PI)*90;
  document.getElementById('cur').style.transform=`translate(${cx}px,${cy}px)`;
  const icon=document.getElementById('icon');
  icon.style.transform=`scale(${Math.max(pulse(t,2.35,.2),pulse(t,2.65,.2))})`;
  document.getElementById('desktop').style.opacity=1-ease(seg(t,2.9,0.3));
  document.getElementById('swash').style.transform=`translateX(${-1600+ease(seg(t,2.85,0.7))*3200}px)`;
  document.getElementById('forest').style.opacity=ease(seg(t,3.1,0.4))*(1-ease(seg(t,15.6,0.4)));
  document.getElementById('video').style.opacity=ease(seg(t,3.0,0.3));
  if(t<FORM_A-0.15) return;
  _ctx.clearRect(0,0,1080,1920);
  for(let i=0;i<_n;i++){
    const g=ease(seg(t,FORM_A+(i/_n)*0.6,FORM_D));
    const x=_starts[i].x+(_targets[i].x-_starts[i].x)*g, y=_starts[i].y+(_targets[i].y-_starts[i].y)*g;
    _ctx.globalAlpha=0.35+0.55*g; _ctx.fillStyle='#211D16';
    _ctx.beginPath(); _ctx.arc(x,y,1.6+0.6*g,0,Math.PI*2); _ctx.fill();
  }
};</script></body></html>
