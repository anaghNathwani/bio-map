name: BioMap
options:
  bundleIdPrefix: com.biomap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  # xcodegen regenerates project.pbxproj from scratch every run, which wipes
  # CocoaPods' integration (added by `pod install`, needed for
  # TensorFlowLiteSwift — see Podfile). Re-running pod install here keeps
  # the two in sync automatically instead of relying on remembering to do it
  # by hand. Open BioMap.xcworkspace after this, not BioMap.xcodeproj.
  postGenCommand: LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0

settings:
  base:
    # The app and its widget extension must carry identical version/build numbers.
    # Every upload to App Store Connect needs a higher build number than the last one (now 4).
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 4

targets:
  BioMap:
    type: application
    platform: iOS
    sources:
      - path: BioMap
    info:
      path: BioMap/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        GCSupportsGameMode: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS/TLS is used, so App Store Connect skips the export-compliance prompt on every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: BioMap needs camera access to photograph bird sightings.
        NSMicrophoneUsageDescription: BioMap records bird calls to identify species by sound.
        NSLocationWhenInUseUsageDescription: BioMap attaches your GPS location to each sighting so it can be placed on the map.
        NSPhotoLibraryUsageDescription: BioMap can use photos from your library to report sightings.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.biomap.app
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.857243141648-0tm0cmmeqin463qsth6c09uq4974l980
    entitlements:
      path: BioMap/BioMap.entitlements
    settings:
      base:
        # Registered with Apple + Firebase (GoogleService-Info.plist). If this ever changes, the URL scheme
        # below, bundleIdPrefix and a new Firebase iOS app/plist have to change with it.
        PRODUCT_BUNDLE_IDENTIFIER: com.biomap.BioMap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: 2JN5C47MQT
        CODE_SIGN_STYLE: Automatic
        # iPhone only: the UI is phone-shaped. Leaving iPad enabled makes App Store Connect demand all four
        # iPad orientations ("Invalid bundle. No orientations were specified").
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          API_BASE_URL: http://localhost:8000
        Release:
          API_BASE_URL: https://birdmap-api.onrender.com
    dependencies:
      - package: ZIPFoundation
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: BioMapWidgets

  # Home screen + lock screen widgets and the two lock-screen corner controls (iOS 18+).
  # No App Group: the widget reads public sightings from Firestore directly and opens the app by URL.
  BioMapWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BioMapWidgets
      - path: BioMap/Views/Common/Theme.swift
      - path: BioMap/GoogleService-Info.plist
    info:
      path: BioMapWidgets/Info.plist
      properties:
        CFBundleDisplayName: BioMap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biomap.BioMap.Widgets
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: 2JN5C47MQT
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

schemes:
  BioMap:
    build:
      targets:
        BioMap: all
    run:
      config: Debug
      preActions:
        - name: Start local backend
          settingsTarget: BioMap
          script: |
            REPO="$SRCROOT/../.."
            docker compose -f "$REPO/docker-compose.yml" up -d --remove-orphans 2>/dev/null || true
            for i in $(seq 1 60); do
              curl -sf http://localhost:8000/health > /dev/null 2>&1 && exit 0
              sleep 1
            done
            echo "Warning: backend did not become healthy in 60s" >&2
    archive:
      config: Release
