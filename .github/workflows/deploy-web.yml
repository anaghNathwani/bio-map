name: Deploy web to Firebase Hosting

# Pushing to GitHub alone never updates the live site — Firebase Hosting only
# serves whatever was last uploaded via `firebase deploy`, which nothing was
# ever wired to run automatically. This closes that gap: any push to main
# touching the web app rebuilds it and deploys straight to Hosting.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web
        env:
          # Set this repo variable once web/scripts/waitlist-apps-script.gs is deployed (see its
          # header) — Settings -> Secrets and variables -> Actions -> Variables. Left unset, the
          # build still succeeds; the waitlist button just tells visitors it isn't connected yet.
          VITE_WAITLIST_SCRIPT_URL: "${{ vars.VITE_WAITLIST_SCRIPT_URL }}"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRDMAP_CITIZENSCIENCE }}"
          projectId: birdmap-citizenscience
          channelId: live
