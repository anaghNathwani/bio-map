name: Deploy web to Firebase Hosting

# Pushing to GitHub alone never updates the live site — Firebase Hosting only
# serves whatever was last uploaded via `firebase deploy`, which nothing was
# ever wired to run automatically. This closes that gap: any push to main
# touching the web app rebuilds it and deploys straight to Hosting.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build && npm run seo:check
        working-directory: web
        env:
          # Firebase's web config is not a secret (it ships in the built JS either way, see
          # https://firebase.google.com/docs/projects/api-keys), but the build needs it, and
          # without it every Firestore call on the deployed site (map, waitlist) fails.
          VITE_FIREBASE_API_KEY: "AIzaSyB3VisSHGhcgr70jAkCWWMttS9kjeXHLck"
          VITE_FIREBASE_AUTH_DOMAIN: "birdmap-citizenscience.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "birdmap-citizenscience"
          VITE_FIREBASE_STORAGE_BUCKET: "birdmap-citizenscience.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "857243141648"
          VITE_FIREBASE_APP_ID: "1:857243141648:web:53bbd34201b43f26c32c95"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}"
          projectId: birdmap-citizenscience
          channelId: live
          entryPoint: web   # deploys with web/firebase.json (headers, clean per-page rewrites, site: getbiomap)
