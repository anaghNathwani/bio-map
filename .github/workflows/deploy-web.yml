name: Deploy web to Firebase Hosting

# Pushing to GitHub alone never updates the live site — Firebase Hosting only
# serves whatever was last uploaded via `firebase deploy`, which nothing was
# ever wired to run automatically. This closes that gap: any push to main
# touching the web app rebuilds it and deploys straight to Hosting.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web
        env:
          # Firebase's web config is not a secret (it's shipped in the built JS either way — see
          # https://firebase.google.com/docs/projects/api-keys), but it still has to come from
          # somewhere at build time. Set these as repo Variables (Settings -> Secrets and
          # variables -> Actions -> Variables) with the same values as web/.env.local; without
          # them the build succeeds but the deployed site's Firestore calls (map, waitlist) fail.
          VITE_FIREBASE_API_KEY: "${{ vars.VITE_FIREBASE_API_KEY }}"
          VITE_FIREBASE_AUTH_DOMAIN: "${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}"
          VITE_FIREBASE_PROJECT_ID: "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
          VITE_FIREBASE_STORAGE_BUCKET: "${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
          VITE_FIREBASE_APP_ID: "${{ vars.VITE_FIREBASE_APP_ID }}"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRDMAP_CITIZENSCIENCE }}"
          projectId: birdmap-citizenscience
          channelId: live
