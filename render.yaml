databases:
  - name: birdmap-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
    databaseName: birdmap
    user: birdmap

services:
  - type: web
    name: birdmap-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 30'"
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: birdmap-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MODEL_REGISTER_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: birdmap-photos
      - key: MODEL_BUCKET
        value: birdmap-models
      - key: PUBLIC_S3_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_CLOUD_API_KEY
        sync: false
      - key: EBIRD_API_KEY
        sync: false
      - key: INSTAGRAM_USER_ID
        value: ""
      - key: INSTAGRAM_ACCESS_TOKEN
        value: ""
