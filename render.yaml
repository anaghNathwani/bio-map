# Deploys to Render's free web service tier (no credit card required).
# Backed by Supabase for Postgres + S3-compatible Storage (also free, no
# card) — not a Render-managed database, since Render's free Postgres tier
# auto-deletes after a fixed period, while Supabase's just pauses after 7
# days idle (recoverable, not destructive). See docs/DEPLOYMENT.md.
#
# DATABASE_URL, S3_*, and FIREBASE_SERVICE_ACCOUNT_JSON are `sync: false` —
# ./deploy.sh sets them for you after provisioning the Supabase project, or
# set them manually via `render env set` / the Render dashboard.
services:
  - type: web
    name: birdmap-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 30'"
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MODEL_REGISTER_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: birdmap-photos
      - key: MODEL_BUCKET
        value: birdmap-models
      - key: PUBLIC_S3_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLOUD_API_KEY
        sync: false
      - key: EBIRD_API_KEY
        sync: false
