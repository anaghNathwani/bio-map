<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>BirdMap: Bird Sighting Map &amp; On-Device Bird ID</title>
    <meta name="description" content="BirdMap is a citizen science app and live map for bird sightings. Identify birds from photos and calls on your phone, then let the community verify them." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://birdmap-citizenscience.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BirdMap" />
    <meta property="og:title" content="BirdMap: Bird Sighting Map &amp; On-Device Bird ID" />

    <script>
      // Applied before first paint so an explicit theme choice never flashes
      // the wrong colors. Falls back to the OS preference via CSS when unset.
      try {
        var t = localStorage.getItem('bm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
